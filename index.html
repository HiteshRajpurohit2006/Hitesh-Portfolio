<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitesh | Portfolio</title>
<style>
:root{--bg:#fff;--surface:#f8fafc;--txt:#111827;--muted:#64748b;--accent:#2563eb;--border:#e2e8f0}
:root[data-theme=dark]{--bg:#0f1115;--surface:#171a21;--txt:#f1f5f9;--muted:#94a3b8;--accent:#60a5fa;--border:#2a2f3a}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
a{color:var(--accent)}
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;padding:14px 5%;background:var(--bg);border-bottom:1px solid var(--border)}
.logo{font-weight:700;margin-right:auto;font-size:1.1rem}
nav a{text-decoration:none;color:var(--muted);font-size:.95rem}nav a:hover{color:var(--accent)}
button{font:inherit;cursor:pointer}
.ib{background:none;border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:5px 12px}
#menu{display:none}
section{max-width:1050px;margin:auto;padding:44px 5%;scroll-margin-top:60px}
h2{font-size:1.6rem;margin-bottom:16px}
#home{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;padding-top:56px}
#home h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.1}
#home h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:1.1rem;margin:12px 0 20px;max-width:520px}
.btn{display:inline-block;padding:9px 20px;border-radius:8px;text-decoration:none;font-weight:600;margin-right:8px;background:var(--accent);color:#fff;border:1px solid var(--accent)}
.btn.o{background:transparent;color:var(--accent)}
.avatar{width:190px;height:190px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:4.5rem;font-weight:700;color:var(--accent);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.duo{max-width:1050px;margin:auto;padding:0 5%;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.duo section{padding:44px 0 24px;max-width:none}
.box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.skill{margin-bottom:12px;font-size:.95rem}.skill:last-child{margin-bottom:0}
.bar{height:6px;background:var(--border);border-radius:4px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.tag{display:inline-block;border:1px solid var(--border);border-radius:20px;padding:1px 10px;margin:4px 4px 0 0;font-size:.78rem;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
#search{flex:1;min-width:220px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--txt);font:inherit}
.chip{background:none;border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:4px 14px;font-size:.88rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column}
.card h3{font-size:1.05rem}.card p{color:var(--muted);font-size:.92rem;margin:8px 0;flex:1}
.card .links{margin-top:10px;display:flex;gap:16px;font-size:.9rem}
#empty{display:none;color:var(--muted);padding:20px 0}
#contactBox{display:flex;gap:10px 36px;flex-wrap:wrap}
#chat{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
#log{height:280px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:8px 13px;border-radius:12px;white-space:pre-wrap;font-size:.95rem}
.m.u{align-self:flex-end;background:var(--accent);color:#fff}.m.b{background:var(--bg);border:1px solid var(--border)}.m.e{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.sugg{padding:8px 12px;border-top:1px solid var(--border)}.sugg button{font-size:.8rem;margin:3px;padding:3px 11px;border:1px solid var(--border);border-radius:14px;background:none;color:var(--muted)}
#cf{display:flex;border-top:1px solid var(--border)}
#cf input{flex:1;padding:12px;border:0;background:var(--bg);color:var(--txt);font:inherit;outline:none}
#cf button{background:var(--accent);color:#fff;border:0;padding:0 22px;font-weight:600}
footer{text-align:center;color:var(--muted);padding:24px;border-top:1px solid var(--border);margin-top:20px;font-size:.9rem}
@media(max-width:820px){.duo{grid-template-columns:1fr;gap:0}}
@media(max-width:720px){#home{grid-template-columns:1fr;text-align:center}#home .sub{margin-inline:auto}.avatar{margin:auto;width:150px;height:150px;font-size:3.5rem;order:-1}
#menu{display:block}nav{flex-wrap:wrap}nav a.l{display:none;width:100%}nav.open a.l{display:block}}
</style>
</head>
<body>
<nav id="nav">
  <span class="logo" id="navName"></span>
  <a class="l" href="#home">Home</a><a class="l" href="#about">About Me</a><a class="l" href="#skills">Skills</a>
  <a class="l" href="#projects">Projects</a><a class="l" href="#contact">Contact</a><a class="l" href="#chatbot">AI Chatbot</a>
  <button class="ib" id="theme">Dark</button><button class="ib" id="menu">☰</button>
</nav>

<section id="home">
  <div>
    <p style="color:var(--muted)">Hello, I'm</p>
    <h1><span id="hName"></span></h1>
    <p class="sub" id="hTag"></p>
    <a class="btn" href="#projects">View Projects</a><a class="btn o" id="gh" target="_blank" rel="noopener">GitHub</a>
  </div>
  <div class="avatar" id="avatar"><img src="photo.jpg" alt="Profile photo" onerror="this.remove();document.getElementById('avatar').textContent=CONFIG.name[0]"></div>
</section>

<div class="duo">
  <section id="about"><h2>About Me</h2><div class="box" id="aboutTxt"></div></section>
  <section id="skills"><h2>Skills</h2><div class="box"><div id="skillList"></div>
    <p style="margin-top:14px"><b>Tools</b></p><div id="toolList"></div></div></section>
</div>

<section id="projects"><h2>My Projects</h2>
  <div class="row"><input id="search" type="search" placeholder="Search by name or technology (Python, Quiz, Book...)"></div>
  <div class="row" id="chips"></div>
  <div class="grid" id="cards"></div>
  <p id="empty">No projects found. Try another keyword.</p>
</section>

<section id="contact"><h2>Contact Information</h2><div class="box" id="contactBox"></div></section>

<section id="chatbot"><h2>AI Chatbot</h2>
  <div id="chat">
    <div id="log"><div class="m b">Hi! Ask me anything about this portfolio.</div></div>
    <div class="sugg" id="sugg"></div>
    <form id="cf"><input id="ci" placeholder="Type your question..." autocomplete="off" maxlength="300"><button>Send</button></form>
  </div>
</section>
<footer>© <span id="yr"></span> <span id="fName"></span></footer>

<script>
/* ===== EDIT THIS: all personal details live here ===== */
const CONFIG = {
  name: "Hitesh",
  tagline: "Aspiring frontend developer who loves coding and building clean, responsive websites.",
  about: "I'm Hitesh, a B.Tech 2nd year student who loves coding and wants to become a great frontend developer. I enjoy building clean, responsive web interfaces and learning new technologies through hands-on projects.",
  education: "B.Tech, 2nd Year",
  github: "https://github.com/HiteshRajpurohit2006",
  email: "hiteshrazz1981@gmail.com",
  skills: [["Python",70],["HTML",75],["CSS",65],["JavaScript",60],["Git & GitHub",60]],
  tools: ["Git","GitHub","Claude","ChatGPT"],
  projects: [
    {title:"Python Programs Collection",tech:["Python","Factorial","Fibonacci","Dictionary"],desc:"Factorial, Fibonacci and Structure-to-Dictionary conversion programs written in Python, with an updated README.",repo:"https://github.com/HiteshRajpurohit2006/python-code-25bcon2685",live:""},
    {title:"Messy Python Code Improvement",tech:["Python","AI","Refactoring"],desc:"A messy Python script improved with AI assistance: clearer names, cleaner structure and better readability.",repo:"https://github.com/HiteshRajpurohit2006/messy-code",live:""},
    {title:"Bug Fixing Using Cursor AI",tech:["Python","Cursor AI","Debugging"],desc:"An incorrect, buggy program that was identified and corrected using Cursor AI.",repo:"https://github.com/HiteshRajpurohit2006/bug-fixing",live:""},
    {title:"Interactive Quiz Application",tech:["HTML","CSS","JavaScript","Quiz"],desc:"An interactive quiz application built with HTML, CSS and JavaScript, with questions, scoring and instant feedback.",repo:"https://github.com/HiteshRajpurohit2006/quiz-app",live:"https://quiz-app-alpha-ten-56.vercel.app/"},
    {title:"Book Reading List Application",tech:["HTML","CSS","JavaScript","Book","Vercel"],desc:"A reading list application where you add books you want to read, track them and manage the list.",repo:"https://github.com/HiteshRajpurohit2006/reading-list",live:"https://reading-list-mu-rust.vercel.app/"}
  ]
};
/* ====================================================== */
const $=id=>document.getElementById(id);
document.title=CONFIG.name+" | Portfolio";
["navName","hName","fName"].forEach(i=>$(i).textContent=CONFIG.name);
$("hTag").textContent=CONFIG.tagline;$("gh").href=CONFIG.github;$("yr").textContent=new Date().getFullYear();
$("aboutTxt").innerHTML=`<p>${CONFIG.about}</p><p style="margin-top:10px"><b>Education:</b> ${CONFIG.education}</p>`;
$("skillList").innerHTML=CONFIG.skills.map(([n,v])=>`<div class="skill"><b>${n}</b> <span style="color:var(--muted)">${v}%</span><div class="bar"><i style="width:${v}%"></i></div></div>`).join("");
$("toolList").innerHTML=CONFIG.tools.map(t=>`<span class="tag">${t}</span>`).join("");
$("contactBox").innerHTML=`<span><b>Email:</b> <a href="mailto:${CONFIG.email}">${CONFIG.email}</a></span><span><b>GitHub:</b> <a href="${CONFIG.github}" target="_blank" rel="noopener">${CONFIG.github.replace("https://","")}</a></span>`;

function setTheme(t){document.documentElement.dataset.theme=t;$("theme").textContent=t==="dark"?"Light":"Dark";try{localStorage.setItem("theme",t)}catch(e){}}
let saved="light";try{saved=localStorage.getItem("theme")||"light"}catch(e){}
setTheme(saved);
$("theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("menu").onclick=()=>$("nav").classList.toggle("open");
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>$("nav").classList.remove("open"));

let tag="All";
const tags=["All",...new Set(CONFIG.projects.flatMap(p=>p.tech))];
function renderChips(){$("chips").innerHTML=tags.map(t=>`<button class="chip ${t===tag?"on":""}" data-t="${t}">${t}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{tag=c.dataset.t;renderChips();renderCards()})}
function renderCards(){
  const q=$("search").value.trim().toLowerCase();
  const list=CONFIG.projects.filter(p=>(tag==="All"||p.tech.includes(tag))&&(!q||(p.title+" "+p.desc+" "+p.tech.join(" ")).toLowerCase().includes(q)));
  $("cards").innerHTML=list.map(p=>`<article class="card"><h3>${p.title}</h3><p>${p.desc}</p><div>${p.tech.map(t=>`<span class="tag">${t}</span>`).join("")}</div><div class="links"><a href="${p.repo}" target="_blank" rel="noopener">GitHub Repo</a>${p.live?`<a href="${p.live}" target="_blank" rel="noopener">Live App</a>`:""}</div></article>`).join("");
  $("empty").style.display=list.length?"none":"block";
}
$("search").oninput=renderCards;renderChips();renderCards();

const log=$("log");
function add(txt,cls){const d=document.createElement("div");d.className="m "+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function ask(q){
  add(q,"u");const wait=add("Thinking...","b");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q,context:CONFIG})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Request failed");
    wait.textContent=d.reply;
  }catch(e){wait.className="m e";wait.textContent="Sorry, the chatbot could not respond: "+e.message+". Please try again in a moment."}
  log.scrollTop=log.scrollHeight;
}
$("cf").onsubmit=e=>{e.preventDefault();const q=$("ci").value.trim();if(q){$("ci").value="";ask(q)}};
$("sugg").innerHTML=["Who are you?","What are your skills?","What projects have you completed?","How does the reading list work?","Where is your GitHub?"].map(s=>`<button type="button">${s}</button>`).join("");
document.querySelectorAll("#sugg button").forEach(b=>b.onclick=()=>ask(b.textContent));
</script>
</body>
</html>
